name: AI Security Review

# Unified Opus-5 security review. Runs on same-repo PRs only (fork-only; never touches upstream).
# NOTE: on `pull_request`, GitHub withholds secrets + downgrades GITHUB_TOKEN for EXTERNAL fork PRs,
# so this effectively covers branches pushed to this repo. Do NOT switch to `pull_request_target`
# without re-review: that trigger would hand secrets + a writable token to untrusted PR content.
# Auth: Claude subscription (CLAUDE_CODE_OAUTH_TOKEN) preferred, ANTHROPIC_API_KEY as fallback.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # to post the review comment

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false # don't write GITHUB_TOKEN into .git/config (zizmor: artipacked)

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription first; fall back to the API key only when no OAuth token is configured.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          use_sticky_comment: true
          prompt: |
            Perform a security review of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Run `gh pr diff ${{ github.event.pull_request.number }}` to get the changes, and read the surrounding code for context.

            Report only real, exploitable vulnerabilities introduced or exposed by this diff:
            - Injection (SQL / command / template), unsafe deserialization, path traversal, SSRF
            - Broken authn/authz, missing access checks, insecure direct object references
            - Cryptographic misuse, weak randomness, secret / credential exposure
            - Memory safety, integer overflow/underflow, unchecked arithmetic, panics on untrusted input (watch Rust `unsafe`)
            - Input-validation gaps, unsafe error handling, resource exhaustion / DoS

            For each finding: `file:line`, severity (Critical/High/Medium/Low), a concrete exploit scenario, and a concrete fix.
            Favor precision over recall — no style/formatting/speculative nits.

            You MUST finish by posting exactly ONE PR comment (even if nothing is found — then post
            "No security issues found in this diff."). Run:
            `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "<markdown>"`
            Start the comment with the heading "## 🔒 AI Security Review (Opus 5)". Posting is required and must be your final action.
          # Read-only allowlist: no `sed` (s///e exec), no blanket `git` (`-c alias=!cmd` exec), no `gh api` (write API).
          claude_args: |
            --model claude-opus-5
            --max-turns 40
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(cat:*),Bash(ls:*),Bash(grep:*),Bash(rg:*),Bash(head:*),Bash(tail:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
